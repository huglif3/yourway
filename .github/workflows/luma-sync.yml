# Aggregates live events from Luma into the board. The key lives only in
# repo secrets (Settings -> Secrets and variables -> Actions -> LUMA_API_KEY).
#
# Governance (CLAUDE.md rule 9 — agents propose, humans merge): this workflow
# never pushes to main. Board changes land on the luma-sync/board branch and
# open (or refresh) a PR for a human to review and merge. Cron only runs on
# the default branch, so nothing is scheduled until this file is merged.
name: luma-sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-luma.mjs
        env:
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
      - name: Propose the board change as a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Board already current."
            exit 0
          fi
          git config user.name "luma-sync"
          git config user.email "noreply@growwithguava.com"
          git checkout -B luma-sync/board
          git add index.html
          git commit -m "Sync live events from Luma"
          git push -f -u origin luma-sync/board
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head luma-sync/board \
            --title "Luma board sync" \
            --body "$(printf 'Automated board update from the Luma calendar (between the LUMA:EVENTS markers in index.html only). Review the rows, then merge to publish.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')" \
            || echo "PR already open — branch updated in place."
